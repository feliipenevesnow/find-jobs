[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "find-jobs-br"
version = "0.1.0"
description = "Monitor de vagas de entrada em desenvolvimento de software"
requires-python = ">=3.11"
dependencies = [
    "python-jobspy==1.5.0",
    "httpx>=0.27,<0.29",
    "beautifulsoup4>=4.12,<5",
    "pydantic>=2.7,<3",
    "PyYAML>=6,<7",
    "python-dotenv>=1,<2",
    "rich>=13,<16",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["src*"]
namespaces = false

[tool.setuptools.package-data]
src = ["panel.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
