# Palavras enviadas aos portais e termos que identificam a sua área na triagem.
search_terms:
  - "desenvolvedor junior"
  - "desenvolvedor jr"
  - "programador junior"
  - "full stack junior"
  - "engenheiro de software junior"
  - "desenvolvedor"
  - "engenheiro de IA"
  - "trainee desenvolvimento"
roles:
  - desenvolvedor
  - desenvolvedora
  - desenvolvimento
  - developer
  - dev
  - programador
  - programadora
  - programação
  - frontend
  - front end
  - backend
  - back end
  - full stack
  - fullstack
  - software engineer
  - software development engineer
  - engenharia de software
  - engenheiro de software
  - engenheira de software
  - engenheiro de IA
  - engenheira de IA
  - engenheiro de inteligência artificial
  - engenheira de inteligência artificial
  - analista de inteligência artificial
  - desenvolvedor de inteligência artificial
  - analista de sistemas
  - AI engineer
  - generative AI engineer
  - machine learning engineer
  - LLM engineer
# A nota combina esta stack com as evidências por requisito do currículo local.
stack: [Python, FastAPI, JavaScript, TypeScript, React, SQL, PostgreSQL, MySQL, RAG, LangChain, LangGraph, Azure, Docker, Git, Java, Spring Boot]
positive: ["júnior", "jr", "junior", "trainee", "entry level", "iniciante", "associado", "associate", "dev I", "desenvolvedor I", "developer I", "engineer I", "recém-formado", "new grad", "graduate software engineer", "early career"]
blocked: ["sênior", "sr", "pleno", "pl", "especialista", "tech lead", "staff", "principal", "arquiteto", "arquiteta", "coordenador", "coordenadora", "gerente", "estágio", "estagio", "estagiário", "estagiária", "estagiario", "estagiaria", "intern", "internship", "aprendiz", "jovem aprendiz"]
excluded_areas: ["programação de TV", "programação de televisão", "programação de rádio", "desenvolvimento de negócios", "desenvolvimento de embalagens", "desenvolvimento de pessoas", "desenvolvimento de mercado", "analista de atendimento"]
# Duas coletas diárias automáticas: manhã (dia anterior) e fim do dia (dia atual).
hours: 36
min_score: 3.0
# Orçamento local compartilhado pelas rodadas com IA remota (janela móvel).
ai_budget:
  finalists_per_run: 3
  requests_per_24h: 6
  tokens_per_24h: 24000
  tokens_per_minute: 12000
# Exige evidência de trabalho integralmente remoto em todas as fontes.
remote: true
# Cidades são usadas somente para o perfil presencial (remote: false).
cities: []
sources: [comunidades, web, programathor, amazon, greenhouse, ashby, himalayas, weworkremotely, gupy, linkedin, indeed, infojobs, vagascom, github, hackernews]
forms_lookback_days: 30
greenhouse_boards: {canonical: Canonical, cloudflare: Cloudflare, gitlab: GitLab, quintoandar: Grupo QuintoAndar, vtex: VTEX}
ashby_boards: {sierra-studio: Sierra Studio, supabase: Supabase, ramp: Ramp}
community_channels: [vagasbackend, vagasfullstack, vagas_dev, CafeinaVagas, VagasBRTI]
# O índice encontra endereços. A triagem lê a página original de cada resultado.
web_pages_per_query: 5
web_queries:
  - 'site:docs.google.com/forms "viewform" vaga desenvolvedor júnior remoto'
  - 'site:docs.google.com/forms "viewform" vaga programador remoto'
  - 'site:docs.google.com/forms "viewform" processo seletivo desenvolvedor remoto'
  - '"forms.gle" vaga desenvolvedor júnior remoto'
  - '"docs.google.com/forms" vaga desenvolvedor júnior remoto'
  - 'site:programathor.com.br/jobs desenvolvedor júnior remoto'
  - 'site:inhire.app desenvolvedor júnior remoto'
  - 'site:jobs.quickin.io desenvolvedor júnior remoto'
  - 'site:vagas.solides.com.br desenvolvedor júnior remoto'
  - 'site:jobs.lever.co junior software engineer remote Brazil'
github_repos: [backend-br/vagas, frontendbr/vagas, pydevbr/vagas, react-brasil/vagas, soujava/vagas-java, phpdevbr/vagas, qa-brasil/vagas, dotnetdevbr/vagas]
# Slugs usados apenas nas páginas de busca do InfoJobs. Ajuste para a sua região.
infojobs_cities: ["sao-paulo,-sp"]
# Limite por termo/repositório. Nube lê o sitemap inteiro para comparar inventários.
results_per_search: 30
database: data/vagas.sqlite3
resume: curriculo.local.md
