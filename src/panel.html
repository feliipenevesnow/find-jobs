<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23175841'/%3E%3Cpath d='M24 20v-3a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v3h8a4 4 0 0 1 4 4v22a4 4 0 0 1-4 4H16a4 4 0 0 1-4-4V24a4 4 0 0 1 4-4h8zm4-2v2h8v-2h-8zm-12 9v7h32v-7H16zm0 11v8h32v-8H36v2a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2v-2H16z' fill='%23f6f7f0'/%3E%3C/svg%3E">
<title>Minhas vagas · Caderno de vagas</title>
<style>
:root{color-scheme:light;--ink:#1e302a;--muted:#53675e;--pine:#175841;--line:#d6dfd4;--paper:#f6f7f0}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:1rem/1.55 "Inter","Segoe UI",sans-serif}
header{border-bottom:1px solid var(--line)}
.wrap{width:min(65rem,92%);margin:auto}
.bar,.job-top,.actions,.tools{display:flex;align-items:center;justify-content:space-between;gap:1rem}
.bar{min-height:4.1rem;flex-wrap:wrap;padding:.8rem 0}
.brand{display:flex;align-items:center;gap:.65rem;font-weight:710}
.mark{width:1.45rem;height:1.7rem;background:var(--pine);border-radius:2px 5px 5px 2px;border-left:4px double var(--paper)}
.stamp,.meta,.found,.summary,label{color:var(--muted)}
.stamp,.found{font-size:.83rem}
main{padding:clamp(2rem,6vw,4rem) 0 4rem}
h1{font:500 clamp(2.8rem,7vw,5rem)/1.04 "Instrument Serif",Georgia,serif;letter-spacing:-.055em;margin:0}
.summary{margin:.8rem 0 2rem;max-width:58rem}
.tools{justify-content:flex-start;align-items:end;flex-wrap:wrap;padding:1.15rem 0;border-block:1px solid var(--line)}
label{display:grid;gap:.25rem;font-size:.81rem;font-weight:650}
.search{flex:1 1 15rem}
input,select{min-height:2.75rem;border:1px solid #aabaae;border-radius:.5rem;background:#fff;color:var(--ink);font:inherit;font-size:.94rem;padding:.55rem .75rem}
input{min-width:0;width:100%}
:focus-visible{outline:3px solid #aa630b;outline-offset:3px}
.count{margin:1.5rem 0 .75rem;color:var(--muted);font-weight:650;font-size:.87rem}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem;align-items:start}
.job,.empty{background:#fff;border:1px solid var(--line);border-radius:.85rem;padding:clamp(1.1rem,3vw,1.65rem);overflow-wrap:anywhere}
.job-top{align-items:start}
.company,.meta,.found{margin:0}
.company{font-size:.9rem;font-weight:650;color:var(--muted)}
.score{font-weight:710;background:#e3efe6;color:#17533a;padding:.25rem .65rem;border-radius:.45rem;white-space:nowrap}
.score small{font-weight:500;font-size:.7rem}
h2{font:670 1.35rem/1.24 "Inter","Segoe UI",sans-serif;margin:.4rem 0 .5rem;letter-spacing:-.025em}
h2 a{color:inherit;text-decoration:none}
a:hover,summary:hover{text-decoration:underline}
.meta{font-size:.91rem}
.tags{display:flex;flex-wrap:wrap;gap:.35rem;list-style:none;padding:0;margin:1rem 0}
.tags:empty{margin:.6rem 0}
.tags li{background:#f0f3ee;border-radius:1rem;padding:.16rem .6rem;font-size:.78rem}
.actions{border-top:1px solid var(--line);padding-top:.9rem;margin-top:.8rem;align-items:start;flex-wrap:wrap}
a.form-link{background:var(--pine);color:white;border-radius:.4rem;padding:.28rem .65rem;font-size:.88rem;text-decoration:none}
.form-note{font-size:.85rem;color:var(--pine);margin:.4rem 0;font-weight:650}
.coverage{margin:-.8rem 0 1.4rem;overflow:auto}.coverage table{border-collapse:collapse;margin-top:.5rem;font-size:.85rem}
.coverage th,.coverage td{text-align:left;padding:.3rem .65rem;border-bottom:1px solid var(--line)}
details{min-width:0}
details ul{padding-left:1.2rem;font-size:.88rem}
details li+li{margin-top:.45rem}
summary,.open{color:var(--pine);font-weight:650;font-size:.89rem;cursor:pointer}
.open{flex-shrink:0;text-underline-offset:.2rem}
.empty{margin:0;color:var(--muted)}
[hidden]{display:none!important}
@media(max-width:42rem){.grid{grid-template-columns:1fr}.tools{gap:.6rem}.search{flex-basis:100%}.tools label:not(.search){flex:1;min-width:0}select{width:100%}.bar{gap:.3rem 1rem}}
</style>
</head>
<body>
<header><div class="wrap bar"><span class="brand"><i class="mark" aria-hidden="true"></i>Caderno de vagas</span><span class="stamp">$updated</span></div></header>
<main class="wrap">
<h1>Minhas vagas</h1>
<p class="summary">$summary</p>
$coverage
<section aria-label="Filtrar oportunidades" class="tools">
<label class="search">Buscar no histórico<input type="search" id="search" placeholder="Cargo, empresa ou tecnologia"></label>
<label>Exibir vagas<select id="period">$last_option<option value="0">Todo o histórico salvo</option><option value="1">Encontradas nas últimas 24 horas</option><option value="7">Encontradas nos últimos 7 dias</option></select></label>
<label>Inscrição<select id="form-filter"><option value="all">Todos os canais</option><option value="form">Google Forms</option></select></label>
<label>Ordenar por<select id="sort"><option value="priority">Google Forms primeiro</option><option value="time">Mais recentes</option><option value="score">Maior aderência</option></select></label>
</section>
<p id="count" class="count" aria-live="polite">$count oportunidade(s)</p>
<div id="grid" class="grid">$cards</div>
<p class="empty" id="empty" $no_cards>$empty</p>
</main>
<script>
const search = document.querySelector('#search'), period = document.querySelector('#period'), sort = document.querySelector('#sort');
const grid = document.querySelector('#grid'), cards = Array.from(grid.children), empty = document.querySelector('#empty');
const formFilter = document.querySelector('#form-filter');
const fold = value => value.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('pt-BR');
const texts = new Map(cards.map(card => [card, fold(card.textContent)]));
function update() {
  const floor = Number(period.value) ? Date.now()/1000 - Number(period.value)*86400 : 0;
  const term = fold(search.value.trim());
  let count = 0;
  cards.sort((a,b) => {
    if (sort.value === 'priority') {
      return Number(b.dataset.form)-Number(a.dataset.form) || Number(b.dataset.score)-Number(a.dataset.score) || Number(b.dataset.time)-Number(a.dataset.time);
    }
    return Number(b.dataset[sort.value])-Number(a.dataset[sort.value]) || Number(b.dataset.time)-Number(a.dataset.time);
  });
  for (const card of cards) {
    card.hidden = (period.value === 'last' && card.dataset.lastHunt !== '1') || Number(card.dataset.time) < floor ||
      !texts.get(card).includes(term) || (formFilter.value === 'form' && card.dataset.form !== '1');
    if (!card.hidden) count++;
    grid.append(card);
  }
  document.querySelector('#count').textContent = count === 1 ? '1 oportunidade' : count + ' oportunidades';
  empty.hidden = count > 0;
  if (cards.length && !count) empty.textContent = 'Nenhuma vaga neste filtro. Tente outro termo ou escolha todo o histórico.';
}
search.addEventListener('input',update);
period.addEventListener('change',update);
formFilter.addEventListener('change',update);
sort.addEventListener('change',update);
update();
</script>
</body>
</html>
